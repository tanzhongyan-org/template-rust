[package]
name = "template-rust"
version = "0.1.0"
edition = "2021"
description = "Universal Rust runtime template with agentic quality guardrails and verification gates."

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
