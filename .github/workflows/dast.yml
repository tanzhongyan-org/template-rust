name: DAST

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    uses: tanzhongyan-org/.github/.github/workflows/dast.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # v1
    with:
      runtime: rust
      tool: zap
      postgres-db: template_rust
      database-url: postgres://postgres:password@localhost:5432/template_rust
      base-url: http://localhost:8000
      health-url: http://localhost:8000/health
      build-command: cargo build --locked
      start-command: cargo run --locked --quiet
      zap-cmd-options: >-
        -z "-config replacer.full_list(0).description=identity
        -config replacer.full_list(0).enabled=true
        -config replacer.full_list(0).matchtype=REQ_HEADER
        -config replacer.full_list(0).matchstring=x-user-id
        -config replacer.full_list(0).replacement=zap-scanner"
