name: DAST

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    uses: tanzhongyan-org/.github/.github/workflows/dast.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # v1
    with:
      runtime: rust
      tool: zap
      postgres-db: template_rust
      database-url: postgres://postgres:password@localhost:5432/template_rust
      base-url: http://localhost:8000
      health-url: http://localhost:8000/health
      build-command: cargo build --locked
      start-command: cargo run --locked --quiet
      # No identity replacer: replacer.full_list(0) with REQ_HEADER injects a
      # malformed empty-name ": <value>" header under ZAP 2.17.0 (packet
      # captured on the T3 template), and strict parsers answer every request
      # 400. The baseline therefore scans the public surface.
