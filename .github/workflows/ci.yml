name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: "Run Verification Gates"
        run: make check
