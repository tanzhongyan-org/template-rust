name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: "Gate 1: Compile & Typecheck"
        run: cargo check --all-targets

      - name: "Gate 2: Format & Clippy"
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: "Gate 3: Unit and Integration Tests"
        run: cargo test

      - name: "Gate 5: Duplication Audit"
        run: npx --yes fallow@3.33.1 dupes --quiet --no-fragments

      - name: "Gate 6: Anti-Slop Scan"
        run: npx --yes --package @ast-grep/cli ast-grep scan
