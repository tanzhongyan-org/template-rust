pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.rs"
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

    secrets:
      run: >-
        if command -v gitleaks >/dev/null 2>&1; then gitleaks git --staged --redact --no-banner;
        else echo "gitleaks is not installed; see .github/CONTRIBUTING.md (Prerequisites)" >&2; fi

    anti-slop:
      run: make anti-slop

    policy:
      run: make policy

    ai-slop-regex:
      run: "! git diff --staged -U0 -- ':(exclude)*.md' | grep -Eiq '\\b(as an ai language model|here is the (rest of the )?code|i hope this helps)\\b'"

commit-msg:
  commands:
    conventional-commit:
      run: "head -n 1 {1} | grep -Eq '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9._/-]+\\))?!?: .+|Merge .+)'"
    forbid-ai-trailers:
      run: "! grep -Eiq 'co-authored-by:.*(claude|copilot|assistant|gpt|gemini|anthropic|openai)' {1}"

pre-push:
  parallel: false
  commands:
    verify:
      run: make verify
    unit-tests:
      run: make test
